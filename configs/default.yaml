# Default MATH-F experiment configuration.
# Every value here can be overridden by environment variables (MODEL_NAME,
# MODEL_BACKEND, MAX_ATTEMPTS, LEAN_PROJECT_DIR, VERIFY_TIMEOUT_SECONDS) or
# by explicit CLI flags, in that priority order (CLI wins).

experiment_id: null  # auto-generated from a timestamp if not set

model:
  backend: hf                 # "hf" (real Transformers model) or "mock"
  name: AI-MO/Kimina-Prover-Preview-Distill-1.5B
  revision: null
  temperature: 0.0
  top_p: 0.95
  do_sample: false
  max_new_tokens: 1024
  device_map: auto
  dtype: auto                 # auto | bfloat16 | float16 | float32

verification:
  timeout_seconds: 60
  lean_cmd: ["lake", "env", "lean"]
  lean_project_dir: "."       # a Lean/Lake project directory with Mathlib built
  max_consecutive_infra_failures: 3

evaluation:
  dataset_name: AI-MO/minif2f_test
  split: test                 # train | valid | test | sample (offline fixtures)
  limit: null                 # cap number of tasks, e.g. for a quick trial run
  shuffle: false
  random_seed: 0
  max_attempts: 5
  duplicate_detection: true

output:
  directory: runs/
