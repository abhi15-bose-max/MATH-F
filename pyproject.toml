[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathf"
version = "0.1.0"
description = "MATH-F: Verifier-Driven Formal Mathematics -- a research framework separating proof-candidate generation from independent formal verification (Lean 4 + Mathlib)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
