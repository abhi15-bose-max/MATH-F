[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-f"
version = "0.1.0"
description = "Verified small-model formal theorem proving evaluation engine (Lean 4 + miniF2F)"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "transformers>=4.45,<5",
  "torch>=2.2,<3",
  "accelerate>=0.34,<2",
  "datasets>=2.20,<4",
  "huggingface_hub>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
math-f = "math_f.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
